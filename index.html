<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Dijitalciniz.co — Dijital Davetiye Atölyesi</title>
<meta name="description" content="Dijitalciniz.co ile düğün, doğum günü ve açılış için dijital davetiyeler. Örnekleri incele, kendi davetiyeni hazırlatalım.">
<meta property="og:title" content="Dijitalciniz.co — Dijital Davetiye">
<meta property="og:description" content="Telefonda açılan, animasyonlu dijital davetiyeler. Örnekleri incele, kendininkini hazırlatalım.">
<meta property="og:type" content="website">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,300;0,400;0,500;1,300&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
:root{
  --ivory:#FBF8F3;
  --sand:#EFE6D9;
  --gold:#C0A167;
  --bordo:#6E1F2E;
  --taupe:#7C6F62;
  --ink:#463C33;
  --card-radius:2px;
  --pad:22px;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth}
body{
  background:var(--ivory);
  color:var(--ink);
  font-family:'Jost',system-ui,sans-serif;
  font-weight:300;
  line-height:1.65;
  -webkit-font-smoothing:antialiased;
  padding-bottom:88px;
}
img{display:block;width:100%;height:100%;object-fit:cover}
a{color:inherit}
:focus-visible{outline:2px solid var(--bordo);outline-offset:3px}

/* ---------- dantel şeridi (üst) ---------- */
.lace{
  height:16px;
  background:
    radial-gradient(circle at 8px 0, transparent 7px, var(--sand) 7.5px) 0 0/16px 16px repeat-x;
  opacity:.9;
}

/* ---------- hero ---------- */
.hero{
  padding:56px var(--pad) 40px;
  text-align:center;
  position:relative;
}
.eyebrow{
  font-size:11px;
  letter-spacing:.34em;
  text-transform:uppercase;
  color:var(--gold);
}
.hero h1{
  font-family:'Cormorant Garamond',serif;
  font-weight:300;
  font-size:clamp(38px,12vw,58px);
  line-height:1.05;
  margin:14px 0 6px;
  color:var(--bordo);
}
.hero .rule{
  width:54px;height:1px;background:var(--gold);
  margin:18px auto;
}
.hero p{
  font-size:15px;
  color:var(--taupe);
  max-width:32ch;
  margin:0 auto;
}

/* ---------- filtreler ---------- */
.filters{
  display:flex;gap:8px;
  overflow-x:auto;
  padding:6px var(--pad) 26px;
  scrollbar-width:none;
}
.filters::-webkit-scrollbar{display:none}
.chip{
  flex:0 0 auto;
  font:inherit;font-size:12.5px;
  letter-spacing:.12em;text-transform:uppercase;
  padding:9px 16px;
  border:1px solid var(--sand);
  background:transparent;color:var(--taupe);
  border-radius:999px;cursor:pointer;
  transition:.25s;
}
.chip[aria-pressed="true"]{
  background:var(--bordo);border-color:var(--bordo);color:var(--ivory);
}

/* ---------- kart ızgarası ---------- */
.grid{
  display:grid;
  grid-template-columns:1fr;
  gap:34px;
  padding:0 var(--pad) 48px;
  max-width:960px;margin:0 auto;
}
@media(min-width:620px){.grid{grid-template-columns:1fr 1fr;gap:40px}}

.card{
  opacity:0;transform:translateY(26px);
  transition:opacity .7s ease,transform .7s cubic-bezier(.22,.61,.36,1);
}
.card.show{opacity:1;transform:none}
.card.hide{display:none}

.frame{
  position:relative;
  aspect-ratio:3/4;
  background:var(--sand);
  border-radius:var(--card-radius);
  overflow:hidden;
  box-shadow:0 12px 28px -18px rgba(70,60,51,.5);
}
/* ince altın iç çerçeve — gerçek davetiye kartı hissi */
.frame::after{
  content:"";position:absolute;inset:10px;
  border:1px solid rgba(192,161,103,.55);
  pointer-events:none;
}
.frame .ph{
  height:100%;display:grid;place-content:center;
  font-family:'Cormorant Garamond',serif;
  font-size:34px;color:var(--gold);
  background:linear-gradient(155deg,#F6EFE4,#E7DAC7);
}
.tag{
  position:absolute;left:0;top:18px;z-index:2;
  background:var(--ivory);
  font-size:10px;letter-spacing:.2em;text-transform:uppercase;
  color:var(--bordo);
  padding:5px 12px 5px 10px;
}
.meta{padding:14px 2px 0}
.meta h2{
  font-family:'Cormorant Garamond',serif;
  font-weight:400;font-size:24px;line-height:1.2;
}
.meta p{font-size:13.5px;color:var(--taupe);margin-top:2px}
.open{
  display:inline-block;margin-top:10px;
  font-size:12px;letter-spacing:.18em;text-transform:uppercase;
  color:var(--bordo);text-decoration:none;
  border-bottom:1px solid var(--gold);
  padding-bottom:3px;
}
.card a.block{text-decoration:none;display:block}
.wa-card{
  display:block;text-align:center;margin-top:12px;
  font-size:12px;letter-spacing:.14em;text-transform:uppercase;
  color:var(--bordo);text-decoration:none;
  border:1px solid var(--sand);border-radius:2px;
  padding:11px 10px;transition:.2s;
}
.wa-card:hover,.wa-card:active{background:var(--bordo);color:var(--ivory);border-color:var(--bordo)}

/* ---------- boş durum ---------- */
.empty{
  grid-column:1/-1;text-align:center;
  color:var(--taupe);font-size:14px;padding:40px 0;
}

/* ---------- alt bant ---------- */
.foot{
  text-align:center;padding:36px var(--pad) 8px;
  border-top:1px solid var(--sand);
}
.foot p{font-size:13px;color:var(--taupe)}
.foot .ig{
  display:inline-block;margin-top:8px;font-size:13px;
  letter-spacing:.1em;color:var(--bordo);text-decoration:none;
}
.bar{
  position:fixed;left:0;right:0;bottom:0;z-index:10;
  background:rgba(251,248,243,.92);
  backdrop-filter:blur(10px);
  border-top:1px solid var(--sand);
  padding:12px var(--pad) calc(12px + env(safe-area-inset-bottom));
}
.bar a{
  display:block;text-align:center;
  background:var(--bordo);color:var(--ivory);
  text-decoration:none;
  font-size:13px;letter-spacing:.16em;text-transform:uppercase;
  padding:15px;border-radius:2px;
  transition:transform .2s;
}
.bar a:active{transform:scale(.985)}

@media(prefers-reduced-motion:reduce){
  html{scroll-behavior:auto}
  .card{opacity:1;transform:none;transition:none}
}
</style>
</head>
<body>

<div class="lace" aria-hidden="true"></div>

<header class="hero">
  <div class="eyebrow">Dijital Davetiye</div>
  <h1>Dijitalciniz.co</h1>
  <div class="rule"></div>
  <p>Düğün, doğum günü ve açılış için telefonda açılan, animasyonlu davetiyeler. Aşağıdaki örneklere dokunup deneyebilirsin.</p>
</header>

<nav class="filters" id="filters" aria-label="Davetiye türleri"></nav>

<main class="grid" id="grid"></main>

<footer class="foot">
  <p>Kendi davetiyen 2 gün içinde hazır. Tarihini yaz, örnek linki gönderelim.</p>
  <a class="ig" href="https://instagram.com/dijitalciniz.co" target="_blank" rel="noopener">@dijitalciniz.co</a>
</footer>

<div class="bar">
  <a id="wa" href="#" target="_blank" rel="noopener">WhatsApp'tan fiyat al</a>
</div>

<script>
/* ============================================================
   BURAYI DÜZENLE — başka hiçbir yere dokunmana gerek yok
   ============================================================ */

const MARKA = {
  whatsapp: "905385143792",              // ülke kodu + numara, boşluksuz
  // WhatsApp'a tıklayınca hazır gelen mesaj. \n satır atlar.
  mesaj:
    "Merhaba Dijitalciniz.co 👋\n" +
    "Dijital davetiyeleriniz hakkında bilgi almak istiyorum.\n\n" +
    "• Davetiye türü (Düğün / Doğum Günü / Açılış): \n" +
    "• Etkinlik tarihi: \n" +
    "• İsimler: \n\n" +
    "Animasyonlu davetiye, geri sayım ve RSVP (katılım) özelliklerini gördüm. " +
    "Fiyat ve teslim süresi hakkında bilgi verir misiniz?"
};

// Şablonların yayında olduğu adres (GitHub Pages). Sonuna / koyma.
const BASE = "https://edavetiye.github.io/Digitalcinizcom";

// Yedek liste — templates.json yüklenemezse gösterilir.
// (Şablonlar otomatik senkronla templates.json'a yazılır; burayı elle güncellemene gerek yok.)
const YEDEK = [
  { ad:"Taha & Melis", tur:"Düğün", not:"Canva tarzı zarif düzen, zarf açılışı, RSVP", link:BASE+"/dugun/canva-tarzi/", kapak:BASE+"/dugun/canva-tarzi/assets/cover.webp" },
  { ad:"Bordo Dantel", tur:"Düğün", not:"Bordo dantel dokular, levha detayları, konum", link:BASE+"/dugun/bordo-dantel/", kapak:BASE+"/dugun/bordo-dantel/assets/kapak.png" },
  { ad:"Prensesimiz Zeynep, 4 Yaş", tur:"Doğum Günü", not:"Hediye kutusu açılış animasyonu, geri sayım, konum ve RSVP", link:BASE+"/dogum-gunu/hediye-kutu-acilimi/", kapak:BASE+"/dogum-gunu/hediye-kutu-acilimi/assets/kapak.png" },
  { ad:"Asel, 4 Yaş — Peri Bahçesi", tur:"Doğum Günü", not:"Peri bahçesi teması, zarif geçişler", link:BASE+"/dogum-gunu/peri-bahcesi/", kapak:BASE+"/dogum-gunu/peri-bahcesi/assets/kapak.webp" },
  { ad:"Sevimli Hayvanlar", tur:"Doğum Günü", not:"Yağlı boya illüstrasyon, video arka plan", link:BASE+"/dogum-gunu/sevimli-hayvanlar-yagli-boya/", kapak:BASE+"/dogum-gunu/sevimli-hayvanlar-yagli-boya/assets/kapak.jpg" },
  { ad:"Prens mi? Prenses mi?", tur:"Doğum Günü", not:"Cinsiyet sürprizi, kabuk açılış animasyonu", link:BASE+"/dogum-gunu/prens-mi-prenses-mi/", kapak:BASE+"/dogum-gunu/prens-mi-prenses-mi/assets/kapak.jpg" },
  { ad:"Güzellik Merkezi — Büyük Açılış", tur:"Açılış", not:"Mağaza açılışı, konum ve davet", link:BASE+"/magaza-acilisi/guzellik-merkezi/", kapak:BASE+"/magaza-acilisi/guzellik-merkezi/assets/kapak.jpg" }
];

// Elle eklenen davetiyeler — bu vitrinde barınan, otomatik senkron dışındaki örnekler.
// Otomatik listeyle birleştirilir. (Şu an boş; şablonlar Digitalcinizcom'dan otomatik gelir.)
const EK = [];

/* ============================================================
   Buradan aşağısı otomatik çalışır
   ============================================================ */

const esc = s => String(s ?? "").replace(/[&<>"]/g, c =>
  ({ "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]));

const waHref = text =>
  "https://wa.me/" + MARKA.whatsapp + "?text=" + encodeURIComponent(text);

document.getElementById("wa").href = waHref(MARKA.mesaj);

const grid = document.getElementById("grid");
const filters = document.getElementById("filters");
let io = null;

function kart(d) {
  const gorsel = d.kapak
    ? `<img src="${esc(d.kapak)}" alt="${esc(d.ad)} davetiyesi" loading="lazy">`
    : `<div class="ph">${esc((d.ad || "•").charAt(0))}</div>`;
  const waMsg =
    "Merhaba Dijitalciniz.co 👋\n" +
    `"${d.ad}" (${d.tur}) davetiyesini beğendim.\n\n` +
    "• Etkinlik tarihi: \n" +
    "• İsimler: \n\n" +
    "Fiyat ve teslim süresi hakkında bilgi verir misiniz?";
  return `
  <article class="card" data-tur="${esc(d.tur)}">
    <a class="block" href="${esc(d.link)}" target="_blank" rel="noopener">
      <div class="frame">
        <span class="tag">${esc(d.tur)}</span>
        ${gorsel}
      </div>
      <div class="meta">
        <h2>${esc(d.ad)}</h2>
        <p>${esc(d.not)}</p>
        <span class="open">Davetiyeyi aç</span>
      </div>
    </a>
    <a class="wa-card" href="${esc(waHref(waMsg))}" target="_blank" rel="noopener">WhatsApp'tan iste</a>
  </article>`;
}

function render(liste) {
  // filtre çubuğu
  filters.innerHTML = "";
  const turler = ["Tümü", ...new Set(liste.map(d => d.tur))];
  turler.forEach((t, i) => {
    const b = document.createElement("button");
    b.className = "chip";
    b.textContent = t;
    b.setAttribute("aria-pressed", i === 0 ? "true" : "false");
    b.addEventListener("click", () => sec(t, b));
    filters.appendChild(b);
  });

  // kartlar
  grid.innerHTML = liste.length
    ? liste.map(kart).join("")
    : `<p class="empty">Örnekler yakında burada. Bu arada WhatsApp'tan yazabilirsin.</p>`;

  // görünürlük animasyonu
  if (io) io.disconnect();
  io = new IntersectionObserver((girisler) => {
    girisler.forEach(g => {
      if (g.isIntersecting) { g.target.classList.add("show"); io.unobserve(g.target); }
    });
  }, { threshold: .15 });
  grid.querySelectorAll(".card").forEach((c, i) => {
    c.style.transitionDelay = (i % 2) * 90 + "ms";
    io.observe(c);
  });
}

function sec(tur, btn) {
  filters.querySelectorAll(".chip").forEach(c =>
    c.setAttribute("aria-pressed", c === btn ? "true" : "false"));
  grid.querySelectorAll(".card").forEach(c => {
    const gorunsun = (tur === "Tümü" || c.dataset.tur === tur);
    c.classList.toggle("hide", !gorunsun);
    if (gorunsun) c.classList.add("show");
  });
}

// Şablon listesini templates.json'dan yükle (otomatik senkronla güncellenir),
// dosya yoksa/erişilemezse yedek listeyi kullan.
fetch("templates.json", { cache: "no-store" })
  .then(r => r.ok ? r.json() : null)
  .then(j => {
    const temel = (j && Array.isArray(j.davetiyeler) && j.davetiyeler.length) ? j.davetiyeler : YEDEK;
    render([...temel, ...EK]);
  })
  .catch(() => render([...YEDEK, ...EK]));
</script>
</body>
</html>
